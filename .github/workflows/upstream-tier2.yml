name: weekly-upstream-digest

# Weekly digest of collector core, operator, proto, and primary SDKs.

on:
  schedule:
    - cron: '23 07 * * 1'   # 07:23 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-upstream
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-digest.mjs weekly

      - name: Create or update digest issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Weekly upstream digest"
          content-filepath: ./digest.md
          labels: |
            upstream-digest
            weekly
          duplicate: true
          update_existing: true
          update_method: append
          search_existing: all
