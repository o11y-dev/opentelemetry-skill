name: upstream-tier2-weekly

# Tier-2: weekly digest of collector core, operator, proto, and primary SDKs.

on:
  schedule:
    - cron: '23 07 * * 1'   # 07:23 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-tier2
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-digest.mjs tier2

      - name: Create digest issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Upstream digest (tier 2) — ${{ github.run_started_at }}"
          content-filepath: ./digest.md
          labels: |
            upstream-digest
            tier-2
