name: OTel Upstream Maintenance Digest

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream-digest:
    name: Build upstream digest issue
    runs-on: ubuntu-latest
    steps:
      - name: Build digest content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import datetime
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "otel-upstream-maintenance-workflow",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          REQUEST_TIMEOUT_SECONDS = 60
          MAX_RETRIES = 3
          MAX_FEED_BYTES = 1_000_000
          ISSUE_REPOS = [
              "open-telemetry/opentelemetry-specification",
              "open-telemetry/opentelemetry-collector-contrib",
              "open-telemetry/opentelemetry-go",
              "etcd-io/bbolt",
          ]
          RELEASE_REPOS = [
              "open-telemetry/opentelemetry-collector",
              "open-telemetry/opentelemetry-python",
              "etcd-io/bbolt",
              "open-telemetry/opentelemetry-collector-contrib",
          ]

          def fetch_url_bytes(url, max_bytes=None):
              for attempt in range(MAX_RETRIES):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=REQUEST_TIMEOUT_SECONDS) as resp:
                          if max_bytes is not None:
                              data = resp.read(max_bytes + 1)
                              if len(data) > max_bytes:
                                  raise ValueError(f"Response exceeded {max_bytes} bytes")
                              return data
                          return resp.read()
                  except urllib.error.HTTPError as exc:
                      reset = exc.headers.get("X-RateLimit-Reset")
                      remaining = exc.headers.get("X-RateLimit-Remaining")
                      print(
                          f"HTTP error for {url}: {exc.code} {exc.reason} "
                          f"(remaining={remaining}, reset={reset})",
                          file=sys.stderr,
                      )
                      if attempt == MAX_RETRIES - 1:
                          return None
                      if remaining == "0" and reset and reset.isdigit():
                          sleep_seconds = max(1, min(120, int(reset) - int(time.time())))
                      else:
                          sleep_seconds = 2 ** (attempt + 1)
                      print(f"Retrying in {sleep_seconds}s...", file=sys.stderr)
                      time.sleep(sleep_seconds)
                  except Exception as exc:
                      print(f"Error fetching {url}: {exc}", file=sys.stderr)
                      if attempt == MAX_RETRIES - 1:
                          return None
                      sleep_seconds = 2 ** (attempt + 1)
                      print(f"Retrying in {sleep_seconds}s...", file=sys.stderr)
                      time.sleep(sleep_seconds)

          def fetch_json(url):
              raw = fetch_url_bytes(url)
              if raw is None:
                  return None
              try:
                  return json.loads(raw.decode("utf-8"))
              except Exception as exc:
                  print(f"JSON parse error for {url}: {exc}", file=sys.stderr)
                  return None

          def fetch_recent_issues(repo, days=14, limit=5):
              base = f"https://api.github.com/repos/{repo}/issues"
              since = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=days)).isoformat()
              issues = []
              for page in range(1, 4):
                  params = {
                      "state": "all",
                      "sort": "updated",
                      "direction": "desc",
                      "since": since,
                      "per_page": "30",
                      "page": str(page),
                  }
                  data = fetch_json(f"{base}?{urllib.parse.urlencode(params)}")
                  if not isinstance(data, list):
                      if not issues:
                          return [("Unable to fetch recent issues (transient API error/rate limit)", f"https://github.com/{repo}/issues")]
                      break
                  batch = [item for item in data if "pull_request" not in item]
                  issues.extend(batch)
                  if len(issues) >= limit or len(data) == 0:
                      break
              return [(i["title"], i["html_url"]) for i in issues[:limit]]

          def fetch_latest_release(repo):
              url = f"https://api.github.com/repos/{repo}/releases/latest"
              data = fetch_json(url)
              if not isinstance(data, dict):
                  return "Unavailable (API error/rate limit)", f"https://github.com/{repo}/releases"
              return data.get("name") or data.get("tag_name", "latest"), data.get("html_url")

          def fetch_blog_posts(limit=5):
              url = "https://opentelemetry.io/blog/index.xml"
              xml_data = fetch_url_bytes(url, max_bytes=MAX_FEED_BYTES)
              if xml_data is None:
                  return [("Unable to fetch feed (transient network/API error)", "https://opentelemetry.io/blog/")]
              upper_sample = xml_data[:4096].upper()
              if b"<!DOCTYPE" in upper_sample or b"<!ENTITY" in upper_sample:
                  print(f"Unsafe XML declarations detected in {url}; skipping parse", file=sys.stderr)
                  return [("Unable to parse feed safely", "https://opentelemetry.io/blog/")]
              try:
                  root = ET.fromstring(xml_data)
                  items = []
                  for item in root.findall(".//item")[:limit]:
                      title = item.findtext("title", default="(untitled)")
                      link = item.findtext("link", default="https://opentelemetry.io/blog/")
                      items.append((title, link))
                  return items
              except Exception as exc:
                  print(f"XML parse error for {url}: {exc}", file=sys.stderr)
                  return [("Unable to fetch feed (transient network/API error)", "https://opentelemetry.io/blog/")]

          KEYWORD_GROUPS = [
              {
                  "title": "Storage & Filesystem Safety",
                  "queries": [
                      {
                          "repos": ["open-telemetry/opentelemetry-collector-contrib", "etcd-io/bbolt"],
                          "keywords": 'mmap OR NFS OR flock OR corruption OR SIGBUS OR EFS OR "file_storage"',
                      }
                  ],
              },
              {
                  "title": "Semantic Convention Breaking Changes",
                  "queries": [
                      {
                          "repos": ["open-telemetry/semantic-conventions"],
                          "keywords": '"breaking change" OR rename OR deprecated OR "semantic conventions"',
                      }
                  ],
              },
              {
                  "title": "OTTL Language Changes",
                  "queries": [
                      {
                          "repos": ["open-telemetry/opentelemetry-collector-contrib"],
                          "keywords": 'OTTL OR "transform processor" OR "breaking change"',
                          "path": "pkg/ottl",
                      }
                  ],
              },
              {
                  "title": "Security Advisories",
                  "queries": [
                      {
                          "repos": [
                              "open-telemetry/opentelemetry-collector",
                              "open-telemetry/opentelemetry-collector-contrib",
                          ],
                          "keywords": 'CVE OR vulnerability OR "security advisory"',
                      }
                  ],
              },
              {
                  "title": "Component Stability Changes",
                  "queries": [
                      {
                          "repos": ["open-telemetry/opentelemetry-collector-contrib"],
                          "keywords": '"stability level" OR "promoted to stable" OR "deprecated" OR "removed"',
                      }
                  ],
              },
              {
                  "title": "Kubernetes Deprecations",
                  "queries": [
                      {
                          "repos": ["open-telemetry/opentelemetry-helm-charts"],
                          "keywords": 'deprecated OR "removed in" OR "breaking change"',
                      }
                  ],
              },
          ]

          def fetch_keyword_issues(repos, keywords, path=None, days=14, limit=3):
              """Search GitHub issues for keyword-filtered risk signals.

              Args:
                  repos: List of 'owner/repo' strings to scope the search.
                  keywords: GitHub search keyword expression (e.g. 'mmap OR NFS').
                  path: Optional path filter for the search (e.g. 'pkg/ottl').
                  days: Only return issues updated within this many days.
                  limit: Maximum number of results to return.

              Returns:
                  List of (title, url) tuples. Returns a single-item error tuple
                  if the API call fails or returns an unexpected response.
              """
              cutoff = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=days)).strftime("%Y-%m-%d")
              repo_filter = " ".join(f"repo:{r}" for r in repos)
              q = f"is:issue {repo_filter} {keywords} updated:>{cutoff}"
              if path:
                  q += f" path:{path}"
              params = {"q": q, "per_page": str(limit), "sort": "updated", "order": "desc"}
              url = f"https://api.github.com/search/issues?{urllib.parse.urlencode(params)}"
              data = fetch_json(url)
              if not isinstance(data, dict) or "items" not in data:
                  print(f"Unexpected response from search API for query {q!r}: {type(data)}", file=sys.stderr)
                  return [("Unable to fetch keyword issues (transient API error/rate limit)", "https://github.com/search")]
              items = data["items"][:limit]
              if not items:
                  return []
              return [(i["title"], i["html_url"]) for i in items]

          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          lines = [
              f"# OpenTelemetry upstream digest ({today})",
              "",
              "This issue is generated by the `OTel Upstream Maintenance Digest` workflow to keep this skill practical and up to date.",
              "",
              "## Recent upstream GitHub issues",
              "",
          ]

          for repo in ISSUE_REPOS:
              lines.append(f"### {repo}")
              for title, url in fetch_recent_issues(repo):
                  lines.append(f"- [{title}]({url})")
              lines.append("")

          lines.extend([
              "## Latest upstream releases",
              "",
          ])
          for repo in RELEASE_REPOS:
              name, url = fetch_latest_release(repo)
              lines.append(f"- **{repo}**: [{name}]({url})")

          lines.extend([
              "",
              "## Recent OpenTelemetry blog posts / community updates",
              "",
          ])
          for title, url in fetch_blog_posts():
              lines.append(f"- [{title}]({url})")

          lines.extend([
              "",
              "## ⚠️ Keyword-filtered risk signals",
              "",
          ])
          for group in KEYWORD_GROUPS:
              lines.append(f"### {group['title']}")
              results = []
              for q in group["queries"]:
                  results.extend(fetch_keyword_issues(
                      q["repos"],
                      q["keywords"],
                      path=q.get("path"),
                  ))
              if results:
                  for title, url in results:
                      lines.append(f"- [{title}]({url})")
              else:
                  lines.append("- _(no matching issues in the last 14 days)_")
              lines.append("")

          lines.extend([
              "",
              "## Maintainer checklist",
              "",
              "- [ ] Review linked upstream issues for guidance changes relevant to `SKILL.md` and `references/`.",
              "- [ ] Capture useful committee/community/blog updates and add practical guidance updates to this repository.",
              "- [ ] Open or update follow-up issue(s) for concrete docs/skill improvements.",
              "- [ ] Check keyword-filtered risk signals for items requiring immediate skill updates.",
              "- [ ] Verify filesystem compatibility warnings in references/collector.md remain accurate against latest bbolt release.",
              "- [ ] Review semantic convention changes for attribute renames that affect skill examples.",
          ])

          with open("upstream-digest.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF

      - name: Create maintenance issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            const title = `OpenTelemetry upstream maintenance digest - ${today}`;
            const body = fs.readFileSync('upstream-digest.md', 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'upstream-maintenance';
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            if (existingIssues.some((issue) => issue.title === title)) {
              core.info(`Issue already exists for ${today}; skipping creation.`);
              return;
            }
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: '0e8a16',
                description: 'Automated upstream maintenance tracking',
              });
            } catch (error) {
              if (error.status === 422) {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label,
                  new_name: label,
                  color: '0e8a16',
                  description: 'Automated upstream maintenance tracking',
                });
              } else {
                throw error;
              }
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: [label],
            });
