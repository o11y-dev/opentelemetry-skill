name: Tessl Behavioral Evaluations

on:
  pull_request:
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'examples/**'
      - 'evals/**'
      - 'tile.json'
      - 'tessl.json'
      - '.github/workflows/evaluate.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tessl-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Tessl
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e
        with:
          version: '0.107.0'
          token: ${{ secrets.TESSL_API_TOKEN }}

      - name: Evaluate committed scenarios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eval-results
          tessl eval run evals --context . --agent claude --model claude-sonnet-4-6 \
            --wait --json --yes | tee eval-results/run.json

      - name: Save evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessl-evaluation-results
          path: eval-results/
          if-no-files-found: warn
