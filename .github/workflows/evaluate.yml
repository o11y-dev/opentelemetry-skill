name: Tessl Behavioral Evaluations

on:
  pull_request:
    paths:
      - 'SKILL.md'
      - 'references/**'
      - 'examples/**'
      - 'evals/**'
      - 'tile.json'
      - 'tessl.json'
      - '.github/workflows/evaluate.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tessl-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Evaluate skill against baseline
        uses: tesslio/skill-eval@056ba23695c6f443ce13ad4e3772683b0d641a33
        with:
          eval-workspace: o11y-dev
          cli-version: '0.107.0'
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
          eval-runs: '1'
          eval-timeout: '45'
          eval-fail-on-regression: 'true'
