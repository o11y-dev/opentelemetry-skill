name: monthly-upstream-digest

# Monthly digest of the specification, OTEPs, helm charts, demo, and
# long-tail SDK/contrib repos.

on:
  schedule:
    - cron: '41 08 1 * *'   # 08:41 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-upstream
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate human-readable date
        id: date
        run: echo "formatted=$(date '+%B %d, %Y')" >> $GITHUB_OUTPUT

      - name: Build digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-digest.mjs monthly

      - name: Create or update digest issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/create-or-update-digest-issue.mjs "Monthly upstream digest - ${{ steps.date.outputs.formatted }}" ./digest.md upstream-digest,monthly
