name: upstream-tier3-monthly

# Tier-3: monthly digest of the specification, OTEPs, helm charts, demo, and
# long-tail SDK/contrib repos.

on:
  schedule:
    - cron: '41 08 1 * *'   # 08:41 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-tier3
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-digest.mjs tier3

      - name: Create digest issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Upstream digest (tier 3) — ${{ github.run_started_at }}"
          content-filepath: ./digest.md
          labels: |
            upstream-digest
            tier-3
