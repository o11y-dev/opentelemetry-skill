name: upstream-tier1-daily

# Tier-1: daily digest of the two highest-churn repos (semantic-conventions,
# opentelemetry-collector-contrib). Membership lives in
# .github/scripts/repos.json; the skill-to-upstream mapping lives in
# .github/upstream-map.yaml.

on:
  schedule:
    - cron: '17 06 * * *'   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-tier1
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-digest.mjs tier1

      - name: Create digest issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Upstream digest (tier 1) — ${{ github.run_started_at }}"
          content-filepath: ./digest.md
          labels: |
            upstream-digest
            tier-1
