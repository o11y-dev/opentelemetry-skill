name: daily-upstream-digest

# Daily digest of the highest-churn repos (semantic-conventions,
# opentelemetry-collector-contrib). Membership lives in
# .github/scripts/repos.json; the skill-to-upstream mapping lives in
# .github/upstream-map.yaml.

on:
  schedule:
    - cron: '17 06 * * *'   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-upstream
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-digest.mjs daily

      - name: Create or update digest issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/create-or-update-digest-issue.mjs "Daily upstream digest" ./digest.md upstream-digest,daily
